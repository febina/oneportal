<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Revenue &amp; Collections Dashboard</title>
<style>

</style></head><body>
<nav id="nav"></nav><main id="app"></main><div id="dl" hidden></div>
<script>
const $=s=>document.querySelector(s),iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),TD=iso(new Date());
const N=v=>+v||0,D=s=>s?new Date(s.length==7?s+'-01T00:00:00':s+'T00:00:00'):null,esc=s=>String(s??'').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const add=(s,n)=>{const d=D(s);if(!d||s==='')return'';d.setDate(d.getDate()+n);return iso(d)},diff=(a,b)=>Math.round((D(a)-D(b))/864e5);
const eom=m=>{const d=D(m);return d?iso(new Date(d.getFullYear(),d.getMonth()+1,0)):''};
const M=v=>v===''||v==null||isNaN(v)?'':Number(v).toLocaleString('en-IN',{maximumFractionDigits:2});
const uniq=a=>[...new Set(a.filter(Boolean))].sort();
const K='srd_v1';let DB;try{DB=JSON.parse(localStorage.getItem(K))}catch(e){}DB=DB||{};
['contract','fte','contractors','clients','exp','rates','team'].forEach(k=>DB[k]=DB[k]||[]);DB.set=DB.set||{mode:'txn',soon:7,end:30};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){}};
const cl=n=>DB.clients.find(c=>c.name==n)||{};
function look(cur,dt){let b=null;DB.rates.forEach(r=>{if(r.cur==cur&&r.act!='No'&&r.eff&&r.eff<=dt&&N(r.rate)&&(!b||r.eff>=b.eff))b=r});return b?N(b.rate):0}
function R(r,dt){const c=r.cur||'INR';if(c=='INR')return 1;const m=DB.set.mode;return m=='txn'?N(r.rate):look(c,m=='monthly'?eom(dt):TD)}
const cat=t=>/courier/i.test(t)?'c':/laptop/i.test(t)?'l':/software|licen/i.test(t)?'s':'o';
const expINR=e=>N(e.amt)*R(e,e.date);
function norm(kind,r){const x={kind,r,cur:r.cur||'INR',client:r.client,team:r.team,lead:r.lead,rec:r.recruiter,l:0,c:0,s:0,o:0,cc:0};const k=cl(r.client);
 if(kind=='Contract'){x.id=r.id;x.name=r.contractor;x.date=r.bm?r.bm+'-01':'';x.rate=R(r,r.bm);x.fc=N(r.brate)*(r.units===''||r.units==null?1:N(r.units));x.elig=eom(r.bm);
  DB.exp.forEach(e=>{if(e.cid&&e.cid==r.id&&(e.date||'').slice(0,7)==r.bm)x[cat(e.type)]+=expINR(e)});x.cc=N(r.sal)+N(r.pay);x.cost=x.cc+x.l+x.c+x.s+x.o}
 else{x.id=r.id;x.name=r.cand;x.date=r.doj||'';x.rate=R(r,r.doj);x.fc=N(r.ctc)*N(r.fee)/100;x.ctc=N(r.ctc)*x.rate;x.elig=add(r.doj,N(k.elig));x.exp=add(r.doj,N(k.expd));x.cost=0}
 x.rev=x.fc*x.rate;x.gstamt=x.rev*N(r.gst)/100;x.tot=x.rev+x.gstamt;x.inv=r.invno;x.invd=r.invdate;x.due=x.invd?add(x.invd,N(k.terms)):'';x.paid=N(r.paid);
 x.profit=x.rev-x.cost;x.pct=x.rev?x.profit/x.rev*100:'';x.dd=x.due?diff(x.due,TD):'';x.od=x.dd!==''&&x.dd<0?-x.dd:0;
 x.st=r.ovr?r.ovr:!x.inv?(x.elig&&x.elig<=TD?'Invoice Pending':'Not Invoiced'):(x.paid>=x.tot-.5&&x.tot>0)?'Paid':x.paid>0?(r.paydate?'Short Paid':'Partially Paid'):x.dd!==''&&x.dd<0?'Overdue':x.dd!==''&&x.dd<=DB.set.soon?'Payment Due':'Invoiced';
 x.out=x.inv&&x.st!='Written Off'?x.tot-x.paid:0;x.diff=x.paid>0?x.tot-x.paid:'';
 x.fu=x.st=='Paid'||x.st=='Written Off'?'Paid':!x.inv?'':x.st=='Short Paid'?'Short Paid':x.dd<0?'Overdue':x.dd==0?'Due Today':x.dd<=DB.set.soon?'Due Soon':(r.fud&&r.fud<=TD)?'Follow-Up Required':'';return x}
const ALL=()=>[...DB.contract.map(r=>norm('Contract',r)),...DB.fte.map(r=>norm('Full-Time',r))];
const col=(k,l,t='t',s)=>({k,l,t,s}),cal=(k,l,f,fmt)=>({k,l,f,fmt,c:1});
const CUR=[col('cur','Currency','t','cur'),col('rate','Rate to INR (txn)','n')],FU=[col('fud','Follow-Up Date','d'),col('fus','Follow-Up Status','t','fus'),col('fuo','Follow-Up Owner'),col('ovr','Status Override','t','ovr'),col('notes','Notes')];
const ORG=[col('recruiter','Recruiter','t','rec'),col('lead','Team Lead','t','leads'),col('team','Team','t','teams'),col('client','Client','t','clients')];
const INV=[col('invno','Invoice Number'),col('invdate','Invoice Date','d')],PAY=[col('paid','Actual Payment (INR)','n'),col('paydate','Payment Date','d')];
const SCH={
contract:{p:'C-',n:'Contract Revenue',k:'Contract',c:[col('id','Contract ID'),col('contractor','Contractor','t','contractors'),...ORG,col('bm','Billing Month','m'),...CUR.slice(0,1),col('brate','Client Billing Rate','n'),col('units','Units (months/days)','n'),CUR[1],cal('fc','Billing FC',x=>x.fc,'n'),cal('rev','Revenue INR (ex-GST)',x=>x.rev,'n'),col('gst','GST %','n'),cal('ga','GST',x=>x.gstamt,'n'),cal('tot','Invoice Total',x=>x.tot,'n'),col('sal','Contractor Payment','n'),col('pay','Employer/Payroll Cost','n'),cal('l','Laptop',x=>x.l,'n'),cal('c','Courier',x=>x.c,'n'),cal('s','Software',x=>x.s,'n'),cal('o','Other Exp',x=>x.o,'n'),cal('cost','Total Cost',x=>x.cost,'n'),cal('pr','Gross Profit',x=>x.profit,'n'),cal('pc','Profit %',x=>x.pct,'n'),...INV,cal('du','Due Date',x=>x.due),...PAY,cal('out','Outstanding',x=>x.out,'n'),cal('st','Status',x=>x.st),...FU]},
fte:{p:'F-',n:'Full-Time Revenue',k:'Full-Time',c:[col('id','Placement ID'),col('cand','Candidate'),...ORG,col('pos','Position'),col('doj','DOJ','d'),col('ctc','Candidate CTC','n'),col('fee','Fee %','n'),...CUR,cal('fc','Fee FC',x=>x.fc,'n'),cal('rev','Revenue INR (ex-GST)',x=>x.rev,'n'),col('gst','GST %','n'),cal('ga','GST',x=>x.gstamt,'n'),cal('tot','Invoice Total',x=>x.tot,'n'),cal('el','Invoice Eligible',x=>x.elig),...INV,cal('du','Payment Due',x=>x.due),cal('ex','Expected Payment',x=>x.exp),...PAY,cal('out','Outstanding',x=>x.out,'n'),cal('df','Diff from Invoice',x=>x.diff,'n'),cal('st','Status',x=>x.st),col('gar','Guarantee Period'),col('ps','Placement Status','t','pst'),...FU]},
contractors:{p:'CT-',n:'Contractor Master',c:[col('id','Contractor ID'),col('name','Contractor Name'),col('eid','Employee ID'),...ORG,col('pos','Position'),col('join','Joining Date','d'),col('cs','Contract Start','d'),col('ce','Contract End','d'),col('status','Status','t','cst'),col('uniq','Unique Recruiter','t','yn'),col('brate','Billing Rate','n'),col('cur','Billing Currency','t','cur'),col('sal','Salary/Payment','n'),col('ctype','Contract Type','t','ctype'),col('repl','Replacement/Termination'),col('notes','Notes')]},
clients:{n:'Client Master',c:[col('name','Client Name'),col('country','Country'),col('cur','Currency','t','cur'),col('bt','Billing Type','t','cur'),col('pt','Client Payout Type','t','pt'),col('eng','Contract/FT/Both','t','eng'),col('terms','Payment Terms (days from invoice)','n'),col('elig','Invoice Eligibility Days','n'),col('expd','Expected Payment Days (from DOJ)','n'),col('gstapp','GST Applicable','t','yn'),col('gst','GST %','n'),col('bc','Billing Contact'),col('fc','Finance Contact'),col('poc','Recruiter POC'),col('team','Team','t','teams'),col('as','Agreement Start','d'),col('ae','Agreement End','d'),col('notes','Notes'),col('act','Active','t','act')]},
exp:{n:'Expense Tracker',c:[col('date','Expense Date','d'),col('type','Expense Type','t','etype'),col('contractor','Contractor','t','contractors'),col('client','Client','t','clients'),col('team','Team','t','teams'),col('recruiter','Recruiter','t','rec'),col('amt','Amount','n'),...CUR,cal('inr','Amount INR',e=>expINR(e),'n'),col('cid','Related Contract ID','t','cid'),col('notes','Notes')]},
rates:{n:'Currency Rates',c:[col('cur','Currency','t','cur'),col('rate','INR Rate','n'),col('eff','Effective Date','d'),col('by','Updated By'),col('act','Active','t','act')]},
team:{n:'Team & Recruiter Master',c:[col('team','Team'),col('lead','Team Lead'),col('recruiter','Recruiter')]}};
const LS={clients:()=>DB.clients.map(c=>c.name),contractors:()=>DB.contractors.map(c=>c.name),rec:()=>uniq(DB.team.map(t=>t.recruiter)),teams:()=>uniq(DB.team.map(t=>t.team)),leads:()=>uniq(DB.team.map(t=>t.lead)),cur:()=>uniq(['INR','USD','EUR','GBP','AED',...DB.rates.map(r=>r.cur)]),cid:()=>DB.contract.map(r=>r.id),
etype:()=>['Laptop Purchase','Laptop Courier','Software','License','Equipment','Recruitment Cost','Contractor-related','Client-specific','Other'],fus:()=>['Not Started','Called','Emailed','Promised','Escalated','Closed'],ovr:()=>['','Disputed','Written Off'],pst:()=>['Placed','Replaced','Dropped','Guarantee Completed'],yn:()=>['Yes','No'],act:()=>['Active','Inactive','Yes','No'],cst:()=>['Active','Ended','Terminated'],pt:()=>['Monthly Contract Billing','Percentage of CTC','Fixed Placement Fee','Other'],eng:()=>['Contract','Full-Time','Both'],ctype:()=>['Payroll','Third-party','Other']};
const FILL={contract(r,k){if(k=='contractor'){const c=DB.contractors.find(c=>c.name==r.contractor);if(c){r.recruiter=c.recruiter;r.lead=c.lead;r.team=c.team;r.client=c.client;r.brate=c.brate;r.cur=c.cur;r.sal=c.sal;k='client'}}
 if(k=='client'){const c=cl(r.client);r.cur=r.cur||c.cur;r.gst=c.gstapp=='Yes'?c.gst:0;r.team=r.team||c.team}
 if(['client','cur','bm','contractor'].includes(k)&&(r.cur||'INR')!='INR')r.rate=look(r.cur,eom(r.bm)||TD)||r.rate||''},
 fte(r,k){if(k=='client'){const c=cl(r.client);r.cur=c.cur||r.cur;r.gst=c.gstapp=='Yes'?c.gst:0;r.team=r.team||c.team}
 if(['client','cur','doj'].includes(k)&&(r.cur||'INR')!='INR')r.rate=look(r.cur,r.doj||TD)||r.rate||''},
 exp(r,k){if(k=='contractor'){const c=DB.contractors.find(c=>c.name==r.contractor);if(c){r.client=c.client;r.team=c.team;r.recruiter=c.recruiter}}if((r.cur||'INR')!='INR'&&!r.rate)r.rate=look(r.cur,r.date||TD)||''},
 team(){}};
const X={contract:r=>norm('Contract',r),fte:r=>norm('Full-Time',r),exp:r=>r};
const fv=(v,f)=>f=='n'?M(v):v??'';const sc=v=>/Overdue|Short|Disputed|Pending/.test(v)?'red':/Paid|Closed/.test(v)&&!/Short|Partially/.test(v)?'grn':/Partial|Due/.test(v)?'amb':'';
function cellCalc(c,x){const v=c.f(x);return`<td class="cc ${c.fmt=='n'?'n ':''}${c.k=='st'?sc(v):''}" data-k="${c.k}">${fv(v,c.fmt)}</td>`}
function grid(tab){const S=SCH[tab],rows=DB[tab],hc=S.c.some(c=>c.c);
 return`<div class=sc data-tab="${tab}"><table><thead><tr>${S.c.map(c=>`<th class="${c.c?'cc':''}">${c.l}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map((r,i)=>{const x=hc?X[tab](r):0;return`<tr data-i="${i}">${S.c.map(c=>c.c?cellCalc(c,x):`<td><input data-k="${c.k}" type="${{d:'date',m:'month',n:'number'}[c.t]||'text'}" ${c.t=='n'?'step=any':''} ${c.s?`list="dl_${c.s}"`:''} value="${esc(r[c.k])}"></td>`).join('')}<td><button onclick="del('${tab}',${i})">✕</button></td></tr>`}).join('')}</tbody></table></div>`}
function view(tab){const S=SCH[tab];return`<h1>${S.n}</h1><p class=note>White cells = manual entry. Grey cells = automatic formulas. Saved in this browser.</p><button class=b onclick="addRow('${tab}')">+ Add row</button>${grid(tab)}`}
function addRow(tab){const S=SCH[tab],r={};if(S.p){let n=DB[tab].length+1;while(DB[tab].some(o=>o.id==S.p+String(n).padStart(3,'0')))n++;r.id=S.p+String(n).padStart(3,'0')}DB[tab].push(r);save();show(cur)}
function del(tab,i){if(confirm('Delete this row?')){DB[tab].splice(i,1);save();show(cur)}}
function dls(){$('#dl').innerHTML=Object.keys(LS).map(k=>`<datalist id="dl_${k}">${LS[k]().map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`).join('')}
$('#app').addEventListener('change',e=>{const i=e.target,tr=i.closest('tr'),box=i.closest('[data-tab]');if(!box||!i.dataset.k)return;const tab=box.dataset.tab,r=DB[tab][tr.dataset.i];r[i.dataset.k]=i.value;FILL[tab]?.(r,i.dataset.k);save();dls();
 const S=SCH[tab],x=S.c.some(c=>c.c)?X[tab](r):0;S.c.forEach(c=>{const el=tr.querySelector(`[data-k="${c.k}"]`);if(!el)return;if(c.c){const v=c.f(x);el.textContent=fv(v,c.fmt);if(c.k=='st')el.className='cc '+sc(v)}else if(el!==document.activeElement)el.value=r[c.k]??''})});
function ro(head,rows){return`<div class=sc><table><thead><tr>${head.map(h=>`<th>${h[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(x=>`<tr>${head.map(h=>{const v=h[1](x);return`<td class="${h[2]=='n'?'n':''} ${h[2]=='s'?sc(v):''}">${h[2]=='n'?M(v):esc(v)}</td>`}).join('')}</tr>`).join('')||'<tr><td>No records yet.</td></tr>'}</tbody></table></div>`}
const invHead=[['Invoice ID',x=>x.id],['Invoice No',x=>x.inv],['Type',x=>x.kind],['Contractor/Candidate',x=>x.name],['Client',x=>x.client],['Team',x=>x.team],['Recruiter',x=>x.rec],['Invoice Date',x=>x.invd],['Due Date',x=>x.due],['Revenue ex-GST',x=>x.rev,'n'],['GST',x=>x.gstamt,'n'],['Invoice Total',x=>x.tot,'n'],['Cur',x=>x.cur],['INR Rate',x=>x.rate,'n'],['Invoice Value INR',x=>x.tot,'n'],['Expected Pmt',x=>x.exp||x.due],['Actual Payment',x=>x.paid,'n'],['Payment Date',x=>x.r.paydate],['Pmt Difference',x=>x.diff,'n'],['Outstanding',x=>x.out,'n'],['Status',x=>x.st,'s'],['Follow-Up Date',x=>x.r.fud],['Days Overdue',x=>x.od],['FU Status',x=>x.r.fus],['FU Owner',x=>x.r.fuo],['Remarks',x=>x.r.notes]];
const fuHead=[['Client',x=>x.client],['Invoice No',x=>x.inv],['Invoice Date',x=>x.invd],['Due Date',x=>x.due],['Expected',x=>x.tot,'n'],['Actual',x=>x.paid,'n'],['Outstanding',x=>x.out,'n'],['Days Until Due',x=>x.dd],['Days Overdue',x=>x.od],['Category',x=>x.fu,'s'],['Follow-Up Date',x=>x.r.fud],['Owner',x=>x.r.fuo],['FU Status',x=>x.r.fus],['Last/Next Follow-Up',x=>x.r.fud],['Remarks',x=>x.r.notes]];
const FL={p:'all',from:'',to:'',team:'',lead:'',rec:'',client:'',type:'',cur:''};
function rng(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),q=Math.floor(m/3),f=(a,b)=>[iso(a),iso(b)];switch(FL.p){case'mtd':return f(new Date(y,m,1),new Date(y,m+1,0));case'pm':return f(new Date(y,m-1,1),new Date(y,m,0));case'q':return f(new Date(y,q*3,1),new Date(y,q*3+3,0));case'y':return[y+'-01-01',y+'-12-31'];case'py':return[y-1+'-01-01',y-1+'-12-31'];case'c':return[FL.from,FL.to||'9999'];}return['','9999']}
function G(T,E,kx,ke){const g={};const o=k=>g[k]=g[k]||{c:0,f:0,cost:0,inv:0,col:0,out:0};T.forEach(x=>{const a=o(kx(x));a[x.kind=='Contract'?'c':'f']+=x.rev;a.cost+=x.cc;a.inv+=x.inv?x.tot:0;a.col+=x.paid;a.out+=x.out});E.forEach(e=>{o(ke(e)).cost+=e.v});return Object.entries(g).filter(e=>e[0]).sort((a,b)=>a[0]<b[0]?-1:1)}
function gt(L,h){return`<div class=sc><table><thead><tr>${h.map(x=>`<th class="${x!=h[0]?'n':''}">${x}</th>`).join('')}</tr></thead><tbody>${L.map(([k,a])=>{const rv=a.c+a.f,p=rv-a.cost;return`<tr><td>${esc(k)}</td>${[a.c,a.f,rv,a.cost,p].map(v=>`<td class=n>${M(v)}</td>`).join('')}<td class=n>${rv?M(p/rv*100)+'%':''}</td>${[a.inv,a.col,a.out].map(v=>`<td class=n>${M(v)}</td>`).join('')}</tr>`}).join('')||'<tr><td>No data</td></tr>'}</tbody></table></div>`}
function bars(ms,ser,stack){const W=Math.max(420,ms.length*(stack?38:26*ser.length+14)),H=200,mx=Math.max(1,...ms.map((_,i)=>stack?ser.reduce((s,a)=>s+Math.max(0,a.v[i]),0):Math.max(...ser.map(a=>a.v[i])))),bw=stack?24:22;let s=`<div class=sc style="max-height:none"><svg width=${W} height=${H+34}>`;
 ms.forEach((m,i)=>{let x0=i*(W/ms.length)+8,y=H;ser.forEach((a,j)=>{const h=Math.max(0,a.v[i])/mx*(H-10);if(stack){y-=h;s+=`<rect x=${x0} y=${y} width=${bw} height=${h} fill="${a.c}"><title>${a.n} ${M(a.v[i])}</title></rect>`}else s+=`<rect x=${x0+j*(bw/ser.length*1.1)} y=${H-h} width=${bw/ser.length*1.05} height=${h} fill="${a.c}"><title>${a.n} ${M(a.v[i])}</title></rect>`});s+=`<text x=${x0} y=${H+14}>${m.slice(2)}</text>`});
 return s+`</svg></div><span class=note>${ser.map(a=>`<b style="color:${a.c}">■</b> ${a.n}`).join(' &nbsp; ')}</span>`}
const kc=(l,v,c='')=>`<div class=k><span>${l}</span><b class="${c}">${v}</b></div>`;
function dash(){const[a,b]=rng(),f=FL,ok=(o,dt)=>(!a||dt>=a)&&dt<=b&&(!f.team||o.team==f.team)&&(!f.client||o.client==f.client)&&(!f.cur||(o.cur||'INR')==f.cur);
 const T=ALL().filter(x=>ok(x,x.date)&&(!f.lead||x.lead==f.lead)&&(!f.rec||x.rec==f.rec)&&(!f.type||x.kind==f.type));
 const E=f.type=='Full-Time'||f.lead?[]:DB.exp.filter(e=>ok(e,e.date||'')&&(!f.rec||e.recruiter==f.rec)).map(e=>({...e,v:expINR(e)}));
 const S=(L,g)=>L.reduce((s,x)=>s+N(g(x)),0),C=T.filter(x=>x.kind=='Contract'),F=T.filter(x=>x.kind=='Full-Time');
 const rev=S(T,x=>x.rev),cr=S(C,x=>x.rev),fr=S(F,x=>x.rev),gst=S(T,x=>x.gstamt),iv=S(T,x=>x.inv?x.tot:0),col=S(T,x=>x.paid),out=S(T,x=>x.out),cc=S(T,x=>x.cc),ex=S(E,e=>e.v),cost=cc+ex,pf=rev-cost,ov=S(T.filter(x=>x.st=='Overdue'),x=>x.out),sh=S(T.filter(x=>x.st=='Short Paid'),x=>x.out);
 const act=DB.contractors.filter(c=>c.status=='Active'&&(!f.team||c.team==f.team)&&(!f.client||c.client==f.client)),nm=uniq(C.map(x=>x.name)).length||1;
 const sel=(k,l,o)=>`<label>${l}<select onchange="FL.${k}=this.value;show('Dashboard')"><option value="">All</option>${o.map(v=>`<option ${FL[k]==v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`;
 const ms=uniq([...T.map(x=>x.date.slice(0,7)),...E.map(e=>(e.date||'').slice(0,7))]),MG=G(T,E,x=>x.date.slice(0,7),e=>(e.date||'').slice(0,7)),mv=k=>ms.map(m=>{const r=MG.find(z=>z[0]==m);return r?r[1][k]:0});
 const H=['Contract Rev','FTE Rev','Total Rev','Cost','Profit','Profit %','Invoiced','Collected','Outstanding'];
 const q=d=>d?d.slice(0,4)+'-Q'+Math.ceil(+d.slice(5,7)/3):'';
 const A=[['Invoices due today',T.filter(x=>x.inv&&x.dd===0&&x.out>0)],['Due within '+DB.set.soon+' days',T.filter(x=>x.inv&&x.dd>0&&x.dd<=DB.set.soon&&x.out>0)],['Overdue invoices',T.filter(x=>x.st=='Overdue')],['Short-paid',T.filter(x=>x.st=='Short Paid')],['Partially paid',T.filter(x=>x.st=='Partially Paid')],['Invoice pending',T.filter(x=>x.kind=='Contract'&&!x.inv&&x.elig&&x.elig<=TD)],['Invoice eligible not raised (FTE)',T.filter(x=>x.kind=='Full-Time'&&!x.inv&&x.elig&&x.elig<=TD)],['Missing invoice number',T.filter(x=>x.invd&&!x.inv)],['Missing payment date',T.filter(x=>x.paid>0&&!x.r.paydate)],
 ['Contracts ending ≤'+DB.set.end+' days',DB.contractors.filter(c=>c.status=='Active'&&c.ce&&diff(c.ce,TD)<=DB.set.end&&diff(c.ce,TD)>=0).map(c=>({id:c.name}))],['Contractors missing billing info',DB.contractors.filter(c=>!N(c.brate)||!c.cur||!N(c.sal)).map(c=>({id:c.name}))],['Missing currency rate',T.filter(x=>x.cur!='INR'&&!x.rate)],['Missing team/recruiter',T.filter(x=>!x.team||!x.rec)],['Expenses not linked to contractor/client',DB.exp.filter(e=>!e.contractor&&!e.client).map(e=>({id:(e.type||'Expense')+' '+(e.date||'')}))]];
 const fuL=T.filter(x=>x.fu&&x.fu!='Paid'&&x.out>0);
 return`<h1>Management Dashboard</h1><p class=note>Revenue = before GST. Profit never uses GST. Period filter applies to billing month (Contract) / DOJ (Full-Time) / expense date.</p>
 <div class=fl><label>Period<select onchange="FL.p=this.value;show('Dashboard')">${[['all','All time'],['mtd','Current Month'],['pm','Previous Month'],['q','Current Quarter'],['y','Current Year'],['py','Previous Year'],['c','Custom Range']].map(o=>`<option value=${o[0]} ${FL.p==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label>${FL.p=='c'?`<label>From<input class=f type=date value="${FL.from}" onchange="FL.from=this.value;show('Dashboard')"></label><label>To<input class=f type=date value="${FL.to}" onchange="FL.to=this.value;show('Dashboard')"></label>`:''}${sel('team','Team',LS.teams())}${sel('lead','Team Lead',LS.leads())}${sel('rec','Recruiter',LS.rec())}${sel('client','Client',LS.clients())}${sel('type','Revenue Type',['Contract','Full-Time'])}${sel('cur','Currency',LS.cur())}</div>
 <h2>Key Numbers</h2><div class=kp>${kc('Total Revenue (ex-GST)','₹'+M(rev))}${kc('Contract Revenue','₹'+M(cr))}${kc('FTE Revenue','₹'+M(fr))}${kc('Total Profit','₹'+M(pf),pf<0?'red':'grn')}${kc('Profit %',rev?M(pf/rev*100)+'%':'–')}${kc('GST Billed','₹'+M(gst))}${kc('Invoiced (incl. GST)','₹'+M(iv))}${kc('Collected','₹'+M(col),'grn')}${kc('Outstanding','₹'+M(out),out?'amb':'')}${kc('Overdue','₹'+M(ov),ov?'red':'')}${kc('Short Payments','₹'+M(sh),sh?'red':'')}${kc('Contractor Cost','₹'+M(cc))}${kc('Expenses','₹'+M(ex))}${kc('Active Contractors',act.length)}${kc('FT Placements',F.length)}</div>
 <h2>Monthly Revenue Trend — Contract vs FTE</h2>${bars(ms,[{n:'Contract',c:'#1f5fbf',v:mv('c')},{n:'FTE',c:'#e08a1e',v:mv('f')}],1)}
 <h2>Profitability — Revenue vs Cost vs Profit</h2>${bars(ms,[{n:'Revenue',c:'#1f5fbf',v:ms.map((m,i)=>mv('c')[i]+mv('f')[i])},{n:'Cost',c:'#c62f2f',v:mv('cost')},{n:'Profit',c:'#1a8a4a',v:ms.map((m,i)=>mv('c')[i]+mv('f')[i]-mv('cost')[i])}])}
 <h2>Team Performance</h2>${gt(G(T,E,x=>x.team||'(no team)',e=>e.team||'(no team)'),['Team',...H])}
 <h2>Client Performance / Profitability</h2>${gt(G(T,E,x=>x.client||'(no client)',e=>e.client||'(no client)'),['Client',...H])}
 <h2>Action Required</h2><div class=box>${A.map(([l,L])=>`<details><summary class="${L.length?'red':''}">${l}: <b>${L.length}</b></summary><span class=note>${L.map(x=>esc(x.id||x.name)).join(', ')}</span></details>`).join('')}</div>
 <h2>Receivables &amp; Follow-Ups (${fuL.length})</h2>${ro(fuHead,fuL)}
 <h2>Contract Staffing</h2><div class=kp>${kc('Active Contractors',act.length)}${kc('Billing (ex-GST)','₹'+M(cr))}${kc('Contractor Cost','₹'+M(S(C,x=>x.cc)))}${kc('Additional Expenses','₹'+M(S(C,x=>x.cost-x.cc)+E.filter(e=>!e.cid).reduce((s,e)=>s+e.v,0)))}${kc('Margin','₹'+M(cr-S(C,x=>x.cost)))}${kc('Revenue / Contractor','₹'+M(cr/nm))}${kc('Profit / Contractor','₹'+M((cr-S(C,x=>x.cost))/nm))}${kc('Outstanding','₹'+M(S(C,x=>x.out)))}</div>
 <h2>Full-Time Engagement</h2><div class=kp>${kc('Placements',F.length)}${kc('Total CTC','₹'+M(S(F,x=>x.ctc)))}${kc('Revenue','₹'+M(fr))}${kc('GST','₹'+M(S(F,x=>x.gstamt)))}${kc('Invoiced','₹'+M(S(F,x=>x.inv?x.tot:0)))}${kc('Collected','₹'+M(S(F,x=>x.paid)))}${kc('Outstanding','₹'+M(S(F,x=>x.out)))}${kc('Avg Fee %',F.length?M(S(F,x=>x.r.fee)/F.length)+'%':'–')}</div>
 <p><b>Cycle:</b> DOJ (${F.length}) → Invoice Eligible (${F.filter(x=>x.elig&&x.elig<=TD).length}) → Invoice Raised (${F.filter(x=>x.inv).length}) → Payment Due (${F.filter(x=>x.inv&&x.out>0).length}) → Payment Received (${F.filter(x=>x.paid>0).length})</p>
 <h2>Monthly Analysis</h2>${gt(MG,['Month',...H])}<h2>Quarterly</h2>${gt(G(T,E,x=>q(x.date),e=>q(e.date||'')),['Quarter',...H])}<h2>Annual</h2>${gt(G(T,E,x=>x.date.slice(0,4),e=>(e.date||'').slice(0,4)),['Year',...H])}`}
function sets(){const s=DB.set;return`<h1>Lists / Settings</h1><div class=box><p><b>Currency rate method</b> <select onchange="DB.set.mode=this.value;save()"><option value=txn ${s.mode=='txn'?'selected':''}>Transaction-specific (rate stored on each row)</option><option value=monthly ${s.mode=='monthly'?'selected':''}>Monthly (latest rate effective by month-end)</option><option value=current ${s.mode=='current'?'selected':''}>Current rate</option></select></p>
<p>"Due soon" days <input class=f type=number value=${s.soon} onchange="DB.set.soon=+this.value;save()"> &nbsp; Contract-ending warning days <input class=f type=number value=${s.end} onchange="DB.set.end=+this.value;save()"></p>
<p class=note>Invoice eligibility days (e.g. 60 from DOJ), expected payment days (e.g. 90) and payment terms are set per client in Client Master. Add new rates as new dated rows in Currency Rates — old rows are kept, so history is never overwritten. Transaction mode stores the rate on the row when you pick the client/currency.</p>
<button class=b onclick="exp_()">Export backup</button><label class=b style="display:inline-block">Import backup<input type=file hidden accept=.json onchange="imp(this.files[0])"></label><button class=b style="background:var(--bad)" onclick="if(confirm('Erase ALL data?')){localStorage.removeItem(K);DB=null;location.reload()}">Erase all</button></div>`}
function exp_(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download='revenue-backup.json';a.click()}
function imp(f){const r=new FileReader();r.onload=()=>{try{DB=JSON.parse(r.result);save();location.reload()}catch(e){alert('Invalid file')}};r.readAsText(f)}
const TABS=[['Dashboard'],['contract'],['fte'],['contractors'],['clients'],['Invoice & Collections'],['exp'],['rates'],['team'],['Follow-Up Tracker'],['Settings']];let cur='Dashboard';
const tn=t=>SCH[t]?.n||t;
function show(t){cur=t;$('#nav').innerHTML=TABS.map(([k])=>`<button class="${k==t?'on':''}" onclick="show('${k}')">${tn(k)}</button>`).join('');dls();const A=ALL();
 $('#app').innerHTML=t=='Dashboard'?dash():SCH[t]?view(t):t=='Settings'?sets():t=='Invoice & Collections'?`<h1>${t}</h1><p class=note>Auto-built from invoice numbers entered in Contract / Full-Time rows.</p>${ro(invHead,A.filter(x=>x.inv))}`:`<h1>${t}</h1><p class=note>Auto-generated. Update follow-up date/status/owner in the source Contract or Full-Time row.</p>${ro(fuHead,A.filter(x=>x.fu&&x.fu!='Paid'||x.st=='Paid'&&x.inv&&0))}`}
show('Dashboard');
</script></body></html>
